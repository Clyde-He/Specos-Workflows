name: CI

on:
  pull_request:
  # Release calls this workflow with the tag, so a release ships only code that passes CI.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: Clyde-He/Specos-Workflows/.github/workflows/macos-ci.yml@v1.5.0
    with:
      project_path: "__PROJECT_PATH__"
      scheme: "__SCHEME__"
      ref: ${{ inputs.ref }}
