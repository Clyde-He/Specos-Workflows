name: CI

on:
  pull_request:
    # Documentation-only changes skip the macOS runners.
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: Clyde-He/Specos-Workflows/.github/workflows/macos-ci.yml@v1.6.0
    with:
      project_path: "__PROJECT_PATH__"
      scheme: "__SCHEME__"
