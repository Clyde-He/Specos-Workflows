name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: Clyde-He/Specos-Workflows/.github/workflows/macos-ci.yml@v1.4.2
    with:
      project_path: "__PROJECT_PATH__"
      scheme: "__SCHEME__"
