name: macOS CI

on:
  workflow_call:
    inputs:
      project_path:
        description: "Path to the caller's .xcodeproj or .xcworkspace"
        required: true
        type: string
      scheme:
        description: "Shared Xcode scheme to build and test"
        required: true
        type: string
      runners:
        description: "JSON array of GitHub-hosted macOS runner labels, one build per Xcode"
        required: false
        default: '["xcode-27", "macos-26"]'
        type: string
      test:
        description: "Run the scheme's tests in Debug"
        required: false
        default: true
        type: boolean
      build_release:
        description: "Also build the Release configuration, which ships"
        required: false
        default: true
        type: boolean
      warnings_as_errors:
        description: "Fail on warnings in the caller's own source files; Swift package warnings are ignored"
        required: false
        default: true
        type: boolean
    secrets:
      swift_package_token:
        description: "Optional token with read access to private Swift package repositories"
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # One Xcode failing must not hide whether the other passes.
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    env:
      PROJECT_PATH: ${{ inputs.project_path }}
      SCHEME: ${{ inputs.scheme }}
      RUN_TESTS: ${{ inputs.test }}
      BUILD_RELEASE: ${{ inputs.build_release }}
      WARNINGS_AS_ERRORS: ${{ inputs.warnings_as_errors }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure private Swift package access
        env:
          SWIFT_PACKAGE_TOKEN: ${{ secrets.swift_package_token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$SWIFT_PACKAGE_TOKEN" ]]; then
            exit 0
          fi

          git_config_global="$RUNNER_TEMP/specos-ci.gitconfig"
          GIT_CONFIG_GLOBAL="$git_config_global" git config --global \
            url."https://x-access-token:${SWIFT_PACKAGE_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          echo "GIT_CONFIG_GLOBAL=$git_config_global" >> "$GITHUB_ENV"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail

          case "$PROJECT_PATH" in
            *.xcodeproj)
              container_flag="-project"
              ;;
            *.xcworkspace)
              container_flag="-workspace"
              ;;
            *)
              echo "project_path must end in .xcodeproj or .xcworkspace." >&2
              exit 1
              ;;
          esac

          # Warnings are checked after the build instead of with *_TREAT_WARNINGS_AS_ERRORS, which also
          # reaches remote Swift packages and conflicts with the -suppress-warnings Xcode gives them.
          settings=(CODE_SIGNING_ALLOWED=NO)

          actions=(build)
          if [[ "$RUN_TESTS" == "true" ]]; then
            actions+=(test)
          fi

          xcodebuild \
            "$container_flag" "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            "${settings[@]}" \
            "${actions[@]}"

          if [[ "$BUILD_RELEASE" == "true" ]]; then
            xcodebuild \
              "$container_flag" "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "platform=macOS" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -resultBundlePath "$RUNNER_TEMP/Release.xcresult" \
              "${settings[@]}" \
              build
          fi

      - name: Check for warnings
        if: ${{ inputs.warnings_as_errors }}
        shell: bash
        run: |
          set -euo pipefail

          result_bundles=("$RUNNER_TEMP/Tests.xcresult")
          if [[ "$BUILD_RELEASE" == "true" ]]; then
            result_bundles+=("$RUNNER_TEMP/Release.xcresult")
          fi

          warnings_found=false
          for result_bundle in "${result_bundles[@]}"; do
            build_results="$RUNNER_TEMP/build-results.json"
            xcrun xcresulttool get build-results --path "$result_bundle" > "$build_results"

            if ! python3 -I - "$build_results" "$GITHUB_WORKSPACE" "$(basename "$result_bundle" .xcresult)" <<'PY'
          import json
          import sys
          from urllib.parse import parse_qs, unquote, urlparse

          results_path, workspace, label = sys.argv[1:]
          workspace = workspace.rstrip("/") + "/"


          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          # Swift package checkouts live in DerivedData, outside the workspace, so only the caller's code counts.
          own_warnings = []
          for warning in json.load(open(results_path)).get("warnings", []):
              location = urlparse(warning.get("sourceURL") or "")
              path = unquote(location.path)
              if path.startswith(workspace):
                  line = parse_qs(location.fragment).get("StartingLineNumber", ["0"])[0]
                  own_warnings.append((path[len(workspace):], int(line) + 1, warning.get("message", "")))

          for path, line, message in own_warnings:
              print(f"::error file={escape(path)},line={line}::{escape(message)}")

          if own_warnings:
              sys.exit(f"{label}: {len(own_warnings)} warning(s) in the app's own source files.")
          PY
            then
              warnings_found=true
            fi
          done

          if [[ "$warnings_found" == "true" ]]; then
            exit 1
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.runner }}
          path: ${{ runner.temp }}/Tests.xcresult
          if-no-files-found: ignore

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/specos-ci.gitconfig"
